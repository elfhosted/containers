---
# Node 22+/24 names the main thread "MainThread", so /proc/<pid>/comm (which
# goss's `process` resource matches) never says "node" for the TREK server.
# procps is not in the image either (no pgrep), so walk /proc directly and look
# for the actual server process: comm MainThread running dist/index.js. This
# deliberately does not match PID 1 (dumb-init, whose cmdline also names
# dist/index.js) or the checking shell itself.
command:
  trek-server-process:
    exec: >-
      sh -c 'for p in /proc/[0-9]*; do
      [ "$(cat $p/comm 2>/dev/null)" = MainThread ] &&
      tr "\0" " " < $p/cmdline 2>/dev/null | grep -q "^node .*dist/index.js" && exit 0;
      done; exit 1'
    exit-status: 0

http:
  # Unauthenticated liveness probe; exempt from FORCE_HTTPS redirects.
  http://localhost:3000/api/health:
    status: 200
    timeout: 5000
    body:
      - '"status":"ok"'
  # The SPA shell (production static serving from server/public).
  http://localhost:3000/:
    status: 200
    timeout: 5000
