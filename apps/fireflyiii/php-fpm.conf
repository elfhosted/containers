[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 127.0.0.1:9000
; pass container env (APP_KEY, DB_*, MAIL_*, ...) through to Laravel
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
; ondemand keeps idle footprint small (Flex collection)
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
pm.max_requests = 500
ping.path = /fpm-ping
ping.response = pong
