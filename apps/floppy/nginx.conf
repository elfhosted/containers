# Adapted from upstream Floppy's nginx.conf for an unprivileged, read-only
# root filesystem: no "user" directive, pid and every temp path under /tmp.
# elf-entrypoint.sh copies this to /tmp/nginx/nginx.conf (adding an IPv6 listen
# when FLOPPY_IPV6_ENABLED=True) and starts nginx from there.
#
# The listener is fixed at 8000. Upstream renders it from FLOPPY_PORT or a port
# saved in Settings > Advanced; the image sets FLOPPY_PORT=8000 so the
# environment owns the value and the settings page cannot move it.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Upstream's format: query strings and referrers can carry OAuth codes or
    # integration tokens, so neither is logged.
    log_format floppy_safe '$remote_addr [$time_local] '
                           '"$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent';
    access_log /dev/stdout floppy_safe;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    # Upstream's limit: history imports (Trakt, Letterboxd, CSV) can be large.
    client_max_body_size 512M;
    client_body_buffer_size 256k;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/manifest+json text/calendar;

    upstream app_server {
        server 127.0.0.1:8001;
    }

    server {
        listen 8000;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        location / {
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /health/ {
            access_log off;
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /static/ {
            alias /floppy/staticfiles/;
            expires 30d;
            add_header Cache-Control "public";
        }
    }
}
