# Adapted from upstream Floppy's nginx.conf for an unprivileged, read-only
# root filesystem: no "user" directive, pid and every temp path under /tmp.
# elf-entrypoint.sh copies this to /tmp/nginx/nginx.conf (adding an IPv6 listen
# when FLOPPY_IPV6_ENABLED=True) and starts nginx from there.
#
# The listener is fixed at 8000. Upstream renders it from FLOPPY_PORT or a port
# saved in Settings > Advanced; the image sets FLOPPY_PORT=8000 so the
# environment owns the value and the settings page cannot move it.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Upstream's format: query strings and referrers can carry OAuth codes or
    # integration tokens, so neither is logged.
    log_format floppy_safe '$remote_addr [$time_local] '
                           '"$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent';
    access_log /dev/stdout floppy_safe;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    # Upstream's limit: history imports (Trakt, Letterboxd, CSV) can be large.
    client_max_body_size 512M;
    client_body_buffer_size 256k;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/manifest+json text/calendar;

    # The real client address. Floppy rate-limits sign-in by X-Real-IP
    # (ALLAUTH_TRUSTED_CLIENT_IP_HEADER), which is $remote_addr below; without
    # this every caller is Traefik's pod and one abuser's attempts lock
    # everyone out. Trusted hops only: Traefik and other in-cluster callers
    # (10.0.0.0/8), loopback, and Cloudflare's edges, the same ranges Traefik
    # trusts for X-Forwarded-* (infra traefik/helmrelease-traefik.yaml).
    # Traefik strips X-Forwarded-For from anyone else, and nginx walks it from
    # the right past trusted hops only, so a forged entry is never the result.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    upstream app_server {
        server 127.0.0.1:8001;
    }

    server {
        listen 8000;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        location / {
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Account creation (local and social sign-up, social login callbacks,
        # which auto-create users) and password recovery (username + one TOTP
        # code, with no attempt limit in Floppy) only for requests that came
        # through ElfHosted SSO: the chart sends these paths through the
        # SSO middleware, which sets X-Auth-Request-Email, and strips that
        # header from every public route. Checked HERE, on nginx's decoded and
        # normalised $uri, because Traefik matches the raw path: an encoded
        # spelling (/accounts%2Fsignup/, /accounts/%73ignup/) can miss the
        # chart's SSO rule yet still reach Django's sign-up view. Everything
        # else (login, the app, the API) uses Floppy's own accounts.
        location ~* ^/accounts/(signup|3rdparty|password/recover)(/|$)|^/accounts/[^/]+/login/callback(/|$) {
            if ($http_x_auth_request_email = "") {
                return 403;
            }
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /health/ {
            access_log off;
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /static/ {
            alias /floppy/staticfiles/;
            expires 30d;
            add_header Cache-Control "public";
        }
    }
}
