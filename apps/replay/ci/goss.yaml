---
# RePlay is a static page served by busybox httpd, so there is no application
# process to assert on beyond the server itself.
process:
  httpd:
    running: true

# No `port` block on purpose. busybox binds 0.0.0.0:8080, which goss does not
# match against a bare `tcp:8080` key (goss#149), and the HTTP checks below
# already prove the port is both listening and serving.
http:
  http://localhost:8080/:
    status: 200
    body:
      - "RePlay"
      - "Your activity, and who can see it"
      # Only matches once the build has stamped a real tag over
      # __REPLAY_VERSION__, so a silent substitution failure fails the test.
      # (The Dockerfile also refuses to build if the placeholder survives.)
      - "var VERSION = 'v"
  http://localhost:8080/og.png:
    status: 200
