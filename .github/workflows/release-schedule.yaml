---
name: "Release: Schedule"

on:
  # Triggered externally via workflow_dispatch by a k8s CronJob (see infra:
  # cronjobs/dispatch-containers-release--flux-system) hourly at :30 UTC.
  #
  # There is deliberately no `schedule:` block here. GitHub deprioritises
  # scheduled workflows and silently drops ticks: over one 17-hour sample this
  # workflow's own "30 * * * *" cron fired 12 times instead of 17, with gaps up
  # to 2h18m. Every dropped tick delays every app whose upstream cut a release
  # in that window, and the delay is invisible — nothing fails, the build just
  # does not happen.
  workflow_dispatch:

# A full matrix build routinely outlives the hourly dispatch interval. Because
# fetch.sh compares against PUBLISHED tags, an overlapping run re-derives the
# same not-yet-pushed changes and both runs race to push the same tag at
# different digests — churning renovate PRs and tenant clusters. Queue instead:
# cancel-in-progress: false lets the running build finish, and GitHub keeps at
# most one pending run, whose matrix is generated fresh when it starts.
concurrency:
  group: release-schedule
  cancel-in-progress: false

env:
  TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_PAT: ${{ secrets.GH_PAT }}
  ZURG_GH_CREDS: ${{ secrets.ZURG_GH_CREDS }}
  PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}

jobs:
  generate-build-matrix:
    name: Generate matrix for building images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.fetch.outputs.changes }}
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ env.TOKEN }}

      # Same overlay as action-image-build.yaml, so an app's ci/latest.sh (and
      # metadata.json) may live in containers-private.
      - name: Checkout private repo
        uses: actions/checkout@v3
        with:
          repository: elfhosted/containers-private
          path: containers-private
          token: ${{ secrets.GH_TOKEN_CONTAINERS_PRIVATE }}
          fetch-depth: 1

      - name: Overlay /apps/ from external repo
        run: |
          cp -r containers-private/apps/* apps/

      - name: Install tools
        run: |
          sudo apt-get update 
          sudo apt-get -y install moreutils jo

      - name: Fetch new app versions
        id: fetch
        run: ./.github/scripts/fetch.sh

  images-build:
    uses: elfhosted/containers/.github/workflows/action-image-build.yaml@main
    if: needs.generate-build-matrix.outputs.matrix != '[]'
    needs:
      - generate-build-matrix
    with:
      imagesToBuild: "${{ needs.generate-build-matrix.outputs.matrix }}"
      pushImages: "true"
      updateMetadata: "true"
      # fetch.sh above compared upstream to ghcr when the matrix was built;
      # by the time a job runs (hourly ticks overlap slow builds, and the
      # build job serialises per app/channel) an earlier run may already
      # have pushed that version. Re-check and skip green instead of
      # building and pushing the same version twice.
      skipIfPublished: "true"
    secrets: inherit
