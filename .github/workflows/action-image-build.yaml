---
name: "Action: Image Build"

on:
  workflow_call:
    inputs:
      imagesToBuild:
        description: |-
          Pass a json string with the images and channels to build. e.g.:
            [
              {
                "app": "sonarr",
                "channel": "main"
              },
              {
                "app": "sonarr",
                "channel": "develop"
              }
            ]
        required: false
        type: string
        default: ''

      pushImages:
        required: false
        default: 'true'
        type: string

      updateMetadata:
        required: false
        default: 'false'
        type: string


env:
  TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ZURG_GH_CREDS: ${{ secrets.ZURG_GH_CREDS }}
  PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    if: inputs.imagesToBuild != '' && inputs.imagesToBuild != '[]'
    strategy:
      matrix:
        image: ["${{ fromJson(inputs.imagesToBuild) }}"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Checkout private repo
        uses: actions/checkout@v3
        with:
          repository: elfhosted/containers-private
          path: containers-private
          token: ${{ secrets.GH_TOKEN_CONTAINERS_PRIVATE }}
          fetch-depth: 1

      - name: Overlay /apps/ from external repo
        run: |
          cp -r containers-private/apps/* apps/

      - name: Setup workflow Variables
        id: vars
        shell: bash
        run: |-
          container_base=$(jq '.base' ./apps/${{ matrix.image.app }}/metadata.json)
          echo "::set-output name=chan_build_date::$(date --rfc-3339=seconds --utc)"

          chan_config=$(jq --arg chan "${{ matrix.image.channel }}" '(.channels | .[] | select(.name == $chan))' ./apps/${{ matrix.image.app }}/metadata.json)
          chan_stable=$(jq --raw-output '.stable' <<< "${chan_config}")

          chan_platforms=$(jq --raw-output '.platforms | join(",")' <<< "${chan_config}") && \
              echo "::set-output name=chan_platforms::${chan_platforms}"
          chan_tests_enabled=$(jq --raw-output '.tests.enabled' <<< "${chan_config}") && \
              echo "::set-output name=chan_tests_enabled::${chan_tests_enabled}"
          chan_tests_type=$(jq --raw-output '.tests.type' <<< "${chan_config}") && \
              echo "::set-output name=chan_tests_type::${chan_tests_type}"

          chan_upstream_version=$(bash ./.github/scripts/upstream.sh "${{ matrix.image.app }}" "${{ matrix.image.channel }}")
          # Never tag an image with an empty/null version: a bogus label can
          # never match the published version on the next schedule run, which
          # forces a rebuild every tick and churns the :rolling digest. Fail
          # the build loudly instead so the broken latest.sh is fixed.
          if [[ -z "${chan_upstream_version}" || "${chan_upstream_version}" == "null" ]]; then
              echo "::error::upstream version for ${{ matrix.image.app }}/${{ matrix.image.channel }} resolved empty/null — refusing to build a null-tagged image"
              exit 1
          fi
          echo "::set-output name=chan_upstream_version::${chan_upstream_version}"

          if [[ "${chan_tests_enabled}" == true && "${chan_tests_type}" == "cli" ]]; then
              echo "::set-output name=chan_goss_args::tail -f /dev/null"
          fi

          if [[ "${container_base}" == true ]]; then
              echo "::set-output name=chan_label_type::org.opencontainers.image.base"
          else
              echo "::set-output name=chan_label_type::org.opencontainers.image"
          fi

          if test -f "./apps/${{ matrix.image.app }}/${{ matrix.image.channel }}/Dockerfile"; then
              echo "::set-output name=chan_dockerfile::./apps/${{ matrix.image.app }}/${{ matrix.image.channel }}/Dockerfile"
              echo "::set-output name=chan_goss_config::./apps/${{ matrix.image.app }}/${{ matrix.image.channel }}/goss.yaml"
          else
              echo "::set-output name=chan_dockerfile::./apps/${{ matrix.image.app }}/Dockerfile"
              echo "::set-output name=chan_goss_config::./apps/${{ matrix.image.app }}/ci/goss.yaml"
          fi

          chan_tag_version="${chan_upstream_version//+/-}"
          if [[ "${chan_stable}" == true ]]; then
              echo "::set-output name=chan_tag_testing::${{ matrix.image.app }}:testingz"
              echo "::set-output name=chan_tag_rolling::${{ matrix.image.app }}:rolling"
              echo "::set-output name=chan_tag_version::${{ matrix.image.app }}:${chan_tag_version}"
          else
              echo "::set-output name=chan_tag_testing::${{ matrix.image.app }}-${{ matrix.image.channel }}:testingz"
              echo "::set-output name=chan_tag_rolling::${{ matrix.image.app }}-${{ matrix.image.channel }}:rolling"
              echo "::set-output name=chan_tag_version::${{ matrix.image.app }}-${{ matrix.image.channel }}:${chan_tag_version}"
          fi

      - name: Setup cli tools
        shell: bash
        run: |
          sudo apt-get update 
          sudo apt-get -y install moreutils jo

      - name: Setup CUE
        uses: cue-lang/setup-cue@v1.0.0-alpha.2

      - name: Setup Goss
        if: ${{ steps.vars.outputs.chan_tests_enabled == 'true' }}
        uses: e1himself/goss-installation-action@v1.1.0
        with:
          # renovate: datasource=github-releases depName=aelsabbahy/goss
          version: v0.3.18

      # - name: Setup QEMU
      #   uses: docker/setup-qemu-action@v2

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      # Exposes ACTIONS_RUNTIME_TOKEN / ACTIONS_CACHE_URL to the environment so a
      # raw `docker buildx build` (the testing build below, which we run directly
      # instead of via build-push-action so we can tee its output for reliable
      # patch-failure detection) can read/write the type=gha layer cache — this is
      # what docker/build-push-action does internally.
      - name: Expose GitHub Actions runtime for buildx gha cache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Setup GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate image metadata
        shell: bash
        run: |-
          cue vet --schema '#Spec' ./apps/${{ matrix.image.app }}/metadata.json ./metadata.rules.cue

      # SOURCE_CACHE_BUSTER: passed to every build; only used by Dockerfiles
      # whose stages source-clone a moving branch (currently radarr, planned:
      # prowlarr — both in containers-private). Including run_attempt invalidates
      # the layer on workflow reruns too. Dockerfiles that don't declare the ARG
      # ignore it harmlessly.
      # Run buildx directly (rather than via build-push-action) and tee the full
      # output to a file. Patches are applied inside the Dockerfile's cloner stage,
      # so a patch-apply failure surfaces here first (release build is skipped when
      # this fails). Teeing to a local file lets the "Detect patch failure" step
      # below grep the real build output reliably — the previous approach fetched
      # this job's own log via the GitHub API mid-run, which is racy (a job's log
      # isn't available through the API until the job finishes), so patch failures
      # were silently misclassified as generic build failures with no role ping.
      # linux/amd64 only — `--load` does not support multi-arch (buildx#290).
      - name: Build container image for testing
        id: testing-build
        shell: bash
        env:
          ZURG_GH_CREDS: ${{ secrets.ZURG_GH_CREDS }}
        run: |
          set -o pipefail
          docker buildx build \
            --build-arg VERSION="${{ steps.vars.outputs.chan_upstream_version }}" \
            --build-arg CHANNEL="${{ matrix.image.channel }}" \
            --build-arg ZURG_GH_CREDS="${ZURG_GH_CREDS}" \
            --build-arg SOURCE_CACHE_BUSTER="${{ github.run_id }}-${{ github.run_attempt }}" \
            --platform linux/amd64 \
            --file "${{ steps.vars.outputs.chan_dockerfile }}" \
            --load \
            --tag "ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.chan_tag_testing }}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --progress plain \
            . 2>&1 | tee "${RUNNER_TEMP}/testing-build.log"

      - name: Run Goss tests
        id: dgoss
        if: ${{ steps.vars.outputs.chan_tests_enabled == 'true' }}
        shell: bash
        env:
          DEBUG: true
          CONTAINER_RUNTIME: docker
          GOSS_FILE: ${{ steps.vars.outputs.chan_goss_config }}
          GOSS_OPTS: |-
            --retry-timeout 180s --sleep 2s --color --format documentation
          GOSS_FILES_STRATEGY: cp
        run: |
          # dgoss run ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.chan_tag_testing }} ${{ steps.vars.outputs.chan_goss_args }}
          set -euo pipefail

          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.chan_tag_testing }}"
          NAME="dgoss-${{ matrix.image.app }}-${{ matrix.image.channel }}"
          DGOSS_RUN_ARGS=(--name "$NAME")

          # Some upstream apps require backing services before they expose a health endpoint.
          # Keep these scoped per-app so normal web/cli goss behaviour is unchanged.
          if [[ "${{ matrix.image.app }}" == "mediafusion" ]]; then
            NET="${NAME}-net"
            PG="${NAME}-postgres"
            REDIS="${NAME}-redis"
            docker network create "$NET"
            docker run -d --name "$PG" --network "$NET"               -e POSTGRES_DB=mediafusion               -e POSTGRES_USER=mediafusion               -e POSTGRES_PASSWORD=mediafusion               postgres:16-alpine
            docker run -d --name "$REDIS" --network "$NET" redis:7-alpine
            for i in {1..60}; do
              if docker exec "$PG" pg_isready -U mediafusion -d mediafusion >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            DGOSS_RUN_ARGS+=(
              --network "$NET"
              -e POSTGRES_URI="postgresql://mediafusion:mediafusion@$PG:5432/mediafusion"
              -e REDIS_URL="redis://$REDIS:6379/0"
              -e MEDIAFUSION_AUTO_MIGRATE=true
              -e SECRET_KEY="mediafusion-goss-secret-key-32b"
            )
          elif [[ "${{ matrix.image.app }}" == "mediastorm" ]]; then
            NET="${NAME}-net"
            PG="${NAME}-postgres"
            docker network create "$NET"
            docker run -d --name "$PG" --network "$NET" \
              -e POSTGRES_DB=mediastorm \
              -e POSTGRES_USER=mediastorm \
              -e POSTGRES_PASSWORD=mediastorm \
              postgres:16-alpine
            for i in {1..60}; do
              if docker exec "$PG" pg_isready -U mediastorm -d mediastorm >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            DGOSS_RUN_ARGS+=(--network "$NET" -e DATABASE_URL="postgres://mediastorm:mediastorm@$PG:5432/mediastorm?sslmode=disable")
          elif [[ "${{ matrix.image.app }}" == "hound" ]]; then
            NET="${NAME}-net"
            PG="${NAME}-postgres"
            docker network create "$NET"
            docker run -d --name "$PG" --network "$NET" \
              -e POSTGRES_DB=hound_db \
              -e POSTGRES_USER=hound \
              -e POSTGRES_PASSWORD=password \
              postgres:16-alpine
            for i in {1..60}; do
              if docker exec "$PG" pg_isready -U hound -d hound_db >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            DGOSS_RUN_ARGS+=(
              --network "$NET"
              -e POSTGRES_HOST="$PG"
              -e POSTGRES_PORT="5432"
              -e POSTGRES_USER="hound"
              -e POSTGRES_PASSWORD="password"
              -e POSTGRES_DB="hound_db"
              -e HOUND_SECRET="hound-goss-secret"
              -e ENABLE_EXTERNAL_LIBRARY=false
            )
          elif [[ "${{ matrix.image.app }}" == "m3ueditor" ]]; then
            CONFIG_DIR="${RUNNER_TEMP}/${NAME}-config"
            mkdir -p "$CONFIG_DIR"
            DGOSS_RUN_ARGS+=(
              -v "$CONFIG_DIR:/var/www/config"
              -e ENABLE_POSTGRES=true
              -e REDIS_ENABLED=true
              -e M3U_PROXY_INTEGRATION_ENABLED=false
              -e M3U_PROXY_ENABLED=false
            )
          elif [[ "${{ matrix.image.app }}" == "stremio-submaker" ]]; then
            DGOSS_RUN_ARGS+=(
              -e STORAGE_TYPE=filesystem
              -e ENCRYPTION_KEY="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
            )
          elif [[ "${{ matrix.image.app }}" == "zurg" ]]; then
            # zurg-public ships no config.yml (the chart seeds one from a
            # ConfigMap at runtime). Started bare, zurg writes a default config
            # and then EXITS, telling you to add a token -- which would fail the
            # process.zurg goss check. Given a token it writes the same default
            # config and stays up retrying auth, so feed it a well-formed dummy.
            # Real-Debrid still rejects it, which is what we want in CI.
            DGOSS_RUN_ARGS+=(-e TOKEN="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA")
          fi

          cleanup() {
            if [[ "${{ matrix.image.app }}" == "mediafusion" ]]; then
              docker rm -f "${NAME}-postgres" "${NAME}-redis" >/dev/null 2>&1 || true
              docker network rm "${NAME}-net" >/dev/null 2>&1 || true
            elif [[ "${{ matrix.image.app }}" == "mediastorm" ]]; then
              docker rm -f "${NAME}-postgres" >/dev/null 2>&1 || true
              docker network rm "${NAME}-net" >/dev/null 2>&1 || true
            elif [[ "${{ matrix.image.app }}" == "hound" ]]; then
              docker rm -f "${NAME}-postgres" >/dev/null 2>&1 || true
              docker network rm "${NAME}-net" >/dev/null 2>&1 || true
            elif [[ "${{ matrix.image.app }}" == "m3ueditor" ]]; then
              rm -rf "${RUNNER_TEMP:?}/${NAME}-config" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          # Start dgoss in background, give the container a name we can log-follow.
          ( dgoss run "${DGOSS_RUN_ARGS[@]}" "$IMAGE" ${{ steps.vars.outputs.chan_goss_args }} ) &
          DGOSS_PID=$!

          # Wait briefly until the container exists (dgoss prints ID but we want a stable name).
          for i in {1..50}; do
            if docker ps -a --format '{{.Names}}' | grep -q "^$NAME$"; then
              break
            fi
            sleep 0.2
          done

          # Stream logs while tests run.
          docker logs -f "$NAME" &
          LOGS_PID=$!

          # Wait for dgoss to finish; preserve exit code.
          STATUS=0
          wait "$DGOSS_PID" || STATUS=$?

          # Always show a final log dump (useful if the log follow raced the stop).
          docker logs "$NAME" || true

          # Exit with dgoss status so the job still fails on test failures.
          exit $STATUS

      # Trivy extracts every layer UNCOMPRESSED to scan it, so peak disk is far
      # larger than the image. whisperx (CUDA runtime + torch CUDA libs + 3GB of
      # baked model weights) exhausted the runner and died after 14 minutes with
      # "write /tmp/fanal-...: no space left on device". The scan then produced
      # no SARIF, the upload step failed, and — because later steps are gated on
      # it — "Build all platforms" was SKIPPED, so a perfectly good image that
      # had already passed goss was never pushed.
      #
      # Reclaimed inline rather than via a third-party free-disk action: this
      # runs on every image in the repo, and an unpinned action at @main is a
      # supply-chain surface we would rather not add to a build that pushes to
      # ghcr. These paths are GitHub-managed toolchains no build here uses.
      #
      # Runs before the scan rather than before the build, so ordinary builds
      # pay nothing extra beyond the one rm.
      - name: Free runner disk before scanning
        shell: bash
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          echo "after:"; df -h / | tail -1

      - name: Scan container image for CVEs
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.chan_tag_testing }}
          format: sarif
          output: trivy-${{ matrix.image.app }}-${{ matrix.image.channel }}.sarif
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          timeout: '20m'

      - name: Upload Trivy scan report
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image.app }}-${{ matrix.image.channel }}.sarif
          category: containers/${{ matrix.image.app }}-${{ matrix.image.channel }}

      - name: Fail on detected vulnerabilities
        id: trivy_gate
        if: ${{ steps.trivy_scan.outcome == 'failure' }}
        run: |
          echo "Trivy reported CRITICAL/HIGH vulnerabilities. See SARIF artifact for specifics."
          exit 1

      # Supply-chain MALWARE scan for Node apps. Trivy (above) only finds
      # DISCLOSED CVEs in known package versions; it cannot see an obfuscated,
      # gated backdoor bundled into a dependency (e.g. the debrid-vault
      # http.Server.emit SEO-cloaking backdoor found 2026-07). This step adds:
      #   - OSV-Scanner: fails ONLY on OSV "MAL-*" malicious-package advisories
      #     (ordinary CVEs are reported, not gated, to avoid breaking builds).
      #   - Socket.dev: behavioral analysis (obfuscation, install scripts,
      #     network/child_process usage, malware) — gates per the Socket org
      #     policy. Requires the SOCKET_SECURITY_API_TOKEN repo secret; set the
      #     Socket policy to BLOCK malware and WARN on lower-severity alerts so
      #     existing builds are not broken by non-malware findings.
      # No JS manifest in the image => not a Node app => this step is a no-op.
      - name: Supply-chain malware scan (Socket.dev + OSV)
        id: supplychain
        shell: bash
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
        run: |
          set -uo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.chan_tag_testing }}"
          osv_rc=0
          socket_rc=0

          cid="$(docker create "$IMAGE")"
          dir="$(mktemp -d)"
          got=0
          for base in /app /upstream-source /source; do
            if docker cp "$cid:$base/package.json" "$dir/package.json" 2>/dev/null; then
              docker cp "$cid:$base/package-lock.json" "$dir/" 2>/dev/null \
                || docker cp "$cid:$base/pnpm-lock.yaml" "$dir/" 2>/dev/null \
                || docker cp "$cid:$base/yarn.lock" "$dir/" 2>/dev/null || true
              got=1; break
            fi
          done
          docker rm -f "$cid" >/dev/null 2>&1 || true

          if [ "$got" = "0" ]; then
            echo "No JS manifest in image — not a Node app, skipping supply-chain scan."
            exit 0
          fi

          # --- OSV-Scanner: gate on malicious packages (MAL-*) only ---
          curl -sSfL "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          echo "::group::OSV-Scanner"
          /tmp/osv-scanner scan source --recursive --format json "$dir" > /tmp/osv.json 2>/dev/null || true
          /tmp/osv-scanner scan source --recursive "$dir" || true   # human-readable log; not gated on CVEs
          echo "::endgroup::"
          if grep -q '"id"[[:space:]]*:[[:space:]]*"MAL-' /tmp/osv.json 2>/dev/null; then
            echo "::error::OSV flagged a MALICIOUS package (MAL-*) in ${{ matrix.image.app }}."
            osv_rc=1
          fi

          # --- Socket.dev: behavioral supply-chain gate ---
          # The Socket org security policy is configured to BLOCK malware and warn
          # on everything else, so `socket ci` fails the build only on malware
          # (plus OSV's precise MAL-* check above). --org is required so the CLI
          # runs non-interactively in CI; the token needs org security-policy read
          # scope (otherwise socket ci 403s).
          #
          # A SCANNER THAT COULD NOT RUN IS NOT A FINDING. Previously every
          # non-zero exit was reported as "flagged malware/policy issues" and
          # blocked the push, so a Socket API outage or a broken CLI release
          # failed builds behind a security-shaped error nobody could act on.
          # That is not hypothetical: the CLI crashed inside its own lazily
          # fetched bundle ("Cannot find module 'form-data'") and harbor-relay's
          # builds failed reporting malware that had never been looked for.
          #
          # `socket ci` is an alias for `scan create --report`; we call that
          # directly to add --json, which wraps every outcome in the CLI's own
          # envelope: {"ok":..,"message":..,"data":{"code":..}}.
          #
          # CLASSIFY ON THAT ENVELOPE ONLY, NEVER BY SEARCHING THE REPORT.
          # The report body contains attacker-controlled text -- package names,
          # versions, paths, descriptions. Grepping it for error signatures means
          # a package named `econnreset` could downgrade a genuine malware
          # verdict to a warning and ship the image. `.message` is CLI-generated
          # and no dependency can reach it.
          #
          # FAIL CLOSED BY DEFAULT: only an outcome positively identified as a
          # transport failure continues. Anything unrecognised blocks, and says
          # it could not be classified rather than claiming malware.
          if [ -n "${SOCKET_SECURITY_API_TOKEN:-}" ]; then
            echo "::group::Socket.dev"
            socket_class="unclassified"
            s_code=""
            # --json puts the envelope alone on STDOUT and every spinner, log and
            # progress line on STDERR. Keeping them in separate files is what
            # makes the classification safe: jq only ever sees the CLI's own
            # document, so there is no "find the JSON in mixed output" step for
            # report content to interfere with.
            sock_json="$(mktemp)"; sock_err="$(mktemp)"

            # PINNED, AND WITH form-data SUPPLIED EXPLICITLY.
            #
            # `npx -y socket` fetched whatever was tagged latest at build time --
            # unpinned third-party code executing in a job that pushes production
            # images, which is the very thing this step exists to guard against.
            # It also meant one bad upstream release broke every Node build here
            # at once, which is exactly what happened.
            #
            # socket@1.1.152 declares only @socketsecurity/socket-patch, yet its
            # bundle require()s form-data when it uploads a manifest, so the scan
            # dies with "Cannot find module 'form-data'" the moment it has
            # something to send. Apps whose scan finds zero files never upload and
            # never see it. Installing form-data as a SIBLING of socket lets node
            # resolve it by walking up from socket/dist/, which is verified to
            # work. Upstream bug; drop the extra package once it is fixed.
            #
            # BOTH are pinned exactly, form-data included. A bare specifier there
            # would have left the very hole this commit closes: the Socket bundle
            # require()s it directly, so any newer release would execute
            # unreviewed code in the job that pushes production images, and an
            # incompatible one would break every Node build again.
            #
            # 2.x of socket is published but deprecated upstream as "bad build",
            # so 1.1.152 is the only usable release and both pins have to be
            # bumped by hand. That is the intended trade: a deliberate bump beats
            # a silent break.
            socket_home="$(mktemp -d)"
            if ! npm i --silent --no-audit --no-fund --prefix "$socket_home" socket@1.1.152 form-data@4.0.6 >"$sock_err" 2>&1; then
              cat "$sock_err"
              socket_class="unclassified"
              echo "Could not install the Socket CLI; not treating that as a scan result."
            else
            for attempt in 1 2 3; do
              socket_rc=0
              ( cd "$dir" && "$socket_home/node_modules/.bin/socket" scan create --report --json --org funky-penguin . ) >"$sock_json" 2>"$sock_err" || socket_rc=$?
              cat "$sock_err"; cat "$sock_json"
              [ "$socket_rc" = "0" ] && { socket_class="pass"; break; }

              # jq absent => cannot classify safely => fail closed rather than guess.
              if ! command -v jq >/dev/null 2>&1; then
                socket_class="unclassified"; break
              fi
              s_ok="$(   jq -r 'if type=="object" then (.ok|tostring) else "x" end'              "$sock_json" 2>/dev/null || echo x  )"
              s_msg="$(  jq -r 'if type=="object" then (.message // "") else "" end'             "$sock_json" 2>/dev/null || echo "" )"
              s_code="$( jq -r 'if type=="object" then ((.data.code // "")|tostring) else "" end' "$sock_json" 2>/dev/null || echo "" )"

              if [ "$s_ok" = "false" ] && [ "$s_msg" = "Socket API error" ]; then
                case "$s_code" in
                  # ALLOWLIST, not a wildcard. Only statuses that a dependency
                  # cannot provoke are treated as "the scanner was unavailable".
                  # A wildcard here is a bypass: a deliberately oversized or
                  # malformed manifest draws a 413 or 422, and every fail-open
                  # branch is reachable by an attacker who can make the scan
                  # fail rather than pass. 400/404/413/422 and a missing status
                  # are therefore NOT transient -- 404 is also what a wrong org
                  # slug returns, which would otherwise disable scanning
                  # permanently and silently.
                  408|429|500|502|503|504) socket_class="infra" ;;
                  # A revoked or under-scoped token must NOT fail open either:
                  # doing so disables scanning for every build.
                  401|403) socket_class="auth"; break ;;
                  *)       socket_class="unclassified"; break ;;
                esac
              else
                socket_class="unclassified"; break
              fi
              [ "$attempt" != "3" ] && { echo "Socket transport failure (attempt $attempt/3), retrying..."; sleep $(( attempt * 10 )); }
            done
            fi
            echo "::endgroup::"

            case "$socket_class" in
              pass)  socket_rc=0 ;;
              infra) echo "::warning::Socket.dev could not complete a scan for ${{ matrix.image.app }} after 3 attempts (transport failure, NOT a finding). Continuing; the OSV MAL-* gate still blocks."
                     socket_rc=0 ;;
              auth)  echo "::error::Socket.dev rejected the API token (${s_code}) for ${{ matrix.image.app }}. Scanning is DISABLED until this is fixed; failing closed rather than shipping unscanned."
                     socket_rc=1 ;;
              *)     echo "::error::Socket.dev failed for ${{ matrix.image.app }} and the outcome could not be classified. This is either a policy/malware verdict or an unrecognised failure; failing closed. See the Socket.dev group above. If the Socket CLI is broken repo-wide rather than this app being at fault, unset the SOCKET_SECURITY_API_TOKEN secret to skip the behavioral scan deliberately and visibly, rather than widening the transient allowlist."
                     socket_rc=1 ;;
            esac
          else
            echo "::warning::SOCKET_SECURITY_API_TOKEN not set — skipping Socket.dev behavioral scan"
          fi

          # Kept separate on purpose: clearing a Socket transport failure must
          # never clear a real OSV malware finding, which one shared rc would.
          if [ "$osv_rc" != "0" ]; then
            echo "::error::OSV flagged a malicious package in ${{ matrix.image.app }}. Failing before push."
          fi
          [ "$osv_rc" = "0" ] && [ "$socket_rc" = "0" ]

      - name: Build all platforms
        id: release
        uses: docker/build-push-action@v5
        with:
          build-args: |-
            VERSION=${{ steps.vars.outputs.chan_upstream_version }}
            CHANNEL=${{ matrix.image.channel }}
            ZURG_GH_CREDS=${{ secrets.ZURG_GH_CREDS }}
            SOURCE_CACHE_BUSTER=${{ github.run_id }}-${{ github.run_attempt }}
          labels: |-
            ${{ steps.vars.outputs.chan_label_type }}.created="${{ steps.vars.outputs.chan_build_date }}"
            ${{ steps.vars.outputs.chan_label_type }}.title="${{ matrix.image.app }} (${{ matrix.image.channel }})"
            ${{ steps.vars.outputs.chan_label_type }}.version="${{ steps.vars.outputs.chan_upstream_version }}"
            ${{ steps.vars.outputs.chan_label_type }}.authors="David Young <funkypenguin@elfhosted.com>"
            ${{ steps.vars.outputs.chan_label_type }}.url="https://github.com/elfhosted/containers/apps/${{ matrix.image.app }}"
            ${{ steps.vars.outputs.chan_label_type }}.build.url="https://github.com/elfhosted/containers/actions/runs/${{ github.run_id }}"
            ${{ steps.vars.outputs.chan_label_type }}.documentation="https://github.com/elfhosted/containers/apps/${{ matrix.image.app }}/README.md"
            ${{ steps.vars.outputs.chan_label_type }}.revision="${{ github.sha }}"

          context: .
          platforms: ${{ steps.vars.outputs.chan_platforms }}
          file: ${{ steps.vars.outputs.chan_dockerfile }}
          push: ${{ inputs.pushImages == 'true' }}
          tags: |-
            ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.chan_tag_rolling }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.vars.outputs.chan_tag_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # If the testing or full build failed, look at the failed step's log
      # and decide whether the failure looks like a patch-apply failure
      # (git apply / git am / patch). When patches stop applying, that
      # almost always means upstream changed and we need to regenerate
      # them, so it's worth surfacing distinctly in Discord.
      - name: Detect patch failure
        id: patch-check
        if: ${{ always() && (steps.release.outcome == 'failure' || steps.testing-build.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e

          # Primary source: the teed testing-build log written this job (reliable,
          # no API/timing dependency). Patch failures always surface in the testing
          # build, so this covers them. Fall back to the API only for the rare case
          # where the testing build succeeded but a later step failed and no local
          # log exists (that path stays best-effort — the API log may be empty
          # mid-run, in which case we degrade to a generic failure notice).
          LOG_FILE="${RUNNER_TEMP}/testing-build.log"
          if [[ -f "$LOG_FILE" ]]; then
            LOG=$(cat "$LOG_FILE")
          else
            # Scope log fetch to *this* matrix job — RUNNER_NAME is unique per
            # concurrent runner, which is the cheapest way to disambiguate.
            JOB_ID=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --paginate \
              --jq ".jobs[] | select(.runner_name == \"$RUNNER_NAME\") | .id" \
              | head -1)

            if [[ -n "$JOB_ID" ]]; then
              LOG=$(gh run view "$GITHUB_RUN_ID" --job "$JOB_ID" --log-failed 2>/dev/null)
            else
              LOG=$(gh run view "$GITHUB_RUN_ID" --log-failed 2>/dev/null)
            fi
          fi

          if [[ -z "$LOG" ]]; then
            echo "could not obtain build log; falling back to generic failure message"
            exit 0
          fi

          # git apply: "error: patch failed: path/file:NN" / "error: <name>: patch does not apply"
          # git am:    "Apply failure on:" / "Patch failed at NNNN"
          # patch(1):  "Hunk #N FAILED" / "patching file ... FAILED"
          # Patterns are deliberately unanchored: `gh run view --log-failed`
          # prefixes every line with `<job>\t<step>\t<timestamp> ` so any ^
          # anchor would silently never match in the real log stream.
          if echo "$LOG" | grep -qE "error: patch failed|patch does not apply|Apply failure on:|Patch failed at |Hunk #[0-9]+ FAILED|patching file .* FAILED"; then
            # Best-effort: name the offending patch. Both `git am` and the
            # `git apply` for-loops echo "Applying <patch>..." before each patch
            # and halt at the first failure, so the LAST "Applying" line is the
            # one that failed. Fall back to the last .patch token seen (excluding
            # the trailing `/patches/*.patch` glob echoed in the RUN error line).
            NAME=$(echo "$LOG" \
              | grep -oE "Applying [A-Za-z0-9._/-]+\.patch" \
              | tail -1 \
              | awk '{print $2}' \
              | xargs -r basename)
            if [[ -z "$NAME" ]]; then
              NAME=$(echo "$LOG" \
                | grep -oE "[A-Za-z0-9._/-]+\.patch" \
                | grep -vF '*' \
                | tail -1 \
                | xargs -r basename)
            fi
            echo "patch_failed=true" >> "$GITHUB_OUTPUT"
            echo "failed_patch=${NAME:-unknown.patch}" >> "$GITHUB_OUTPUT"
            echo "detected patch failure (patch: ${NAME:-unknown.patch})"
          else
            echo "no patch-failure signature found in failed step logs"
          fi


  # Summarize matrix https://github.community/t/status-check-for-a-matrix-jobs/127354/7
  build_success:
    name: Build matrix success
    runs-on: ubuntu-latest
    needs:
      - build-and-test
    if: ${{ always() }}
    steps:
      - name: Check build matrix status
        if: ${{ (inputs.imagesToBuild != '' && inputs.imagesToBuild != '[]') && (needs.build-and-test.result != 'success') }}
        run: exit 1
